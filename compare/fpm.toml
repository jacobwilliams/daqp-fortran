# Comparison of the Fortran port with the upstream C library.
#
# Not part of the package: build the C library first, then run from this
# directory:
#
#   ../tools/build_upstream.sh
#   fpm run --profile release --link-flag "-L../build/upstream"
#
# (libdaqp is listed in [build] link, so that fpm links it after the objects:
# GNU ld only takes from a static library what the objects before it need)
#
name = "daqp-compare"
version = "0.1.0"

[build]
link = ["daqp"]
auto-executables = true
auto-tests = false
auto-examples = false

[library]
source-dir = "src"
include-dir = ["../upstream/daqp/include"]

[dependencies]
daqp-fortran = { path = ".." }

[fortran]
implicit-typing = false
implicit-external = false
